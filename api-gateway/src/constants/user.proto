syntax = "proto3";

package user;

import "google/protobuf/empty.proto";

service UserService {
    rpc GetUsers(Empty) returns (UserList) {}
    rpc GetUserById(UserById) returns (User) {}
}

message Empty {}

message UserById {
    int32 id = 1;
}

message User {
    int32 id = 1;
    string name = 2;
}

message UserList {
    repeated User users = 1;
}